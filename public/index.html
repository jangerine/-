<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3장 섯다 하우스</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --mat-green: #154726;
            --wood-dark: #1b0e07;
            --wood-mid: #2e180c;
            --gold: #dfb15b;
            --gold-bright: #ffd700;
        }

        * { touch-action: manipulation; }

        body {
            font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
            background-color: var(--wood-dark);
            color: #f0e6d2;
            margin: 0;
            padding: 10px;
            text-align: center;
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
            background: radial-gradient(circle, #1a572f 0%, var(--mat-green) 100%);
            border: 8px solid #3d2112;
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            box-sizing: border-box;
        }

        .screen { display: none; }
        .active { display: block; }

        .lobby-title { font-size: 22px; color: var(--gold-bright); margin-bottom: 15px; font-weight: bold; }
        .input-group { margin: 10px 0; }
        input, select {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            border-radius: 8px;
            border: 1px solid var(--gold);
            background: #2b170c;
            color: #fff;
            box-sizing: border-box;
            text-align: center;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(223, 177, 91, 0.3);
            padding-bottom: 8px;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .money-board {
            display: flex;
            justify-content: space-around;
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(223, 177, 91, 0.4);
            padding: 8px;
            border-radius: 10px;
            margin-bottom: 10px;
            font-weight: bold;
            color: var(--gold-bright);
            font-size: 13px;
        }

        .card-area {
            display: flex;
            justify-content: center;
            gap: 8px;
            min-height: 80px;
            margin: 10px 0;
            align-items: center;
        }

        .card {
            width: 50px;
            height: 75px;
            background: linear-gradient(135deg, #ffffff 0%, #f0e6d2 100%);
            border: 2px solid #333;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 18px;
            color: #111;
            position: relative;
            box-shadow: 2px 3px 6px rgba(0,0,0,0.5);
            cursor: pointer;
        }
        .card.selected-open { border: 3px solid #00ffcc; transform: translateY(-4px); }
        .card.selected-final { border: 3px solid var(--gold-bright); transform: translateY(-6px); }
        .card.disabled { opacity: 0.4; background: #888; cursor: not-allowed; }
        .card-back { background: #801010; color: var(--gold); border: 2px solid var(--gold); }

        .badge {
            position: absolute;
            top: -8px;
            right: -5px;
            background: #000;
            color: var(--gold-bright);
            font-size: 9px;
            padding: 1px 3px;
            border-radius: 4px;
            border: 1px solid var(--gold);
        }

        .status-box {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px;
            border-radius: 8px;
            min-height: 45px;
            margin: 10px 0;
            font-size: 13px;
            white-space: pre-line;
            color: #fff;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        button {
            padding: 12px 0;
            font-weight: bold;
            font-size: 14px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(180deg, #edd293 0%, #c59740 100%);
            color: #2b170c;
            cursor: pointer;
        }
        button:disabled { background: #3a3a3a !important; color: #777 !important; }
        .btn-die { background: linear-gradient(180deg, #e75c5c 0%, #b82323 100%); color: white; grid-column: span 2; }

        .opponent-open-area {
            background: rgba(0, 0, 0, 0.35);
            padding: 6px;
            border-radius: 8px;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="container">

    <div id="lobby-screen" class="screen active">
        <div class="lobby-title">🎴 섯다 게임 로비</div>
        
        <div class="input-group">
            <input type="text" id="nickname-input" placeholder="닉네임 입력">
        </div>

        <div style="border: 1px dashed var(--gold); padding: 10px; border-radius: 8px; margin-bottom: 12px;">
            <div style="font-size: 12px; color: var(--gold); margin-bottom: 5px;">[방 만들기]</div>
            <select id="max-players-select" style="margin-bottom: 8px;">
                <option value="2">2명 게임</option>
                <option value="3">3명 게임</option>
                <option value="4">4명 게임</option>
            </select>
            <button id="btn-create-room" style="width: 100%;">방 만들기 (방장)</button>
        </div>

        <div style="border: 1px dashed var(--gold); padding: 10px; border-radius: 8px;">
            <div style="font-size: 12px; color: var(--gold); margin-bottom: 5px;">[방 참여하기]</div>
            <input type="text" id="room-code-input" placeholder="방 코드 4자리 입력" style="margin-bottom: 8px;">
            <button id="btn-join-room" style="width: 100%;">방 참여하기</button>
        </div>
    </div>

    <div id="game-screen" class="screen">
        <div class="header">
            <div>코드: <span id="display-room-code" style="color:var(--gold-bright);">0000</span></div>
            <div id="player-role" style="color:var(--gold-bright);">접속 중...</div>
        </div>

        <div class="money-board">
            <div>💵 내 잔액: <span id="my-money">100,000</span>원</div>
            <div>💰 판돈: <span id="total-pot">0</span>원</div>
        </div>

        <div class="opponent-open-area">
            <div style="color:var(--gold); font-size:11px;">👁️ 공개된 패</div>
            <div class="card-area" id="opponent-cards">
                <div class="card card-back">🎴</div>
            </div>
        </div>

        <div class="status-box" id="status-text">상대방을 기다리는 중입니다...</div>

        <button id="host-start-btn" style="width: 100%; margin-bottom: 10px; display: none; background: #ffb703;">🎮 게임 시작 (방장 전용)</button>

        <div id="card-instruction" style="font-size:12px; color:var(--gold);">👤 내 패</div>
        <div class="card-area" id="player-cards"></div>

        <div class="btn-grid">
            <button id="half-btn" class="bet-btn" disabled>하프</button>
            <button id="call-btn" class="bet-btn" disabled>콜</button>
            <button id="die-btn" class="bet-btn btn-die" disabled>기권 (DIE)</button>
        </div>
    </div>

</div>

<script>
    const socket = io();
    let myCards = [];
    let openCardIndex = -1;
    let finalCardIndex = -1;
    let selectPhase = 'NONE';
    let isProcessing = false;

    function bindMobileListener(element, callback) {
        let handled = false;
        element.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handled = true;
            callback(e);
        }, { passive: false });

        element.addEventListener('click', (e) => {
            if (handled) {
                handled = false;
                return;
            }
            callback(e);
        });
    }

    bindMobileListener(document.getElementById('btn-create-room'), () => {
        const nickname = document.getElementById('nickname-input').value.trim() || '방장';
        const maxPlayers = document.getElementById('max-players-select').value;
        socket.emit('createRoom', { nickname, maxPlayers });
    });

    bindMobileListener(document.getElementById('btn-join-room'), () => {
        const nickname = document.getElementById('nickname-input').value.trim() || '플레이어';
        const roomId = document.getElementById('room-code-input').value.trim();
        if (!roomId) return alert('방 코드를 입력해주세요.');
        socket.emit('joinRoom', { nickname, roomId });
    });

    bindMobileListener(document.getElementById('host-start-btn'), () => {
        socket.emit('startGame');
    });

    bindMobileListener(document.getElementById('half-btn'), () => sendBet('하프'));
    bindMobileListener(document.getElementById('call-btn'), () => sendBet('콜'));
    bindMobileListener(document.getElementById('die-btn'), () => sendBet('다이'));

    socket.on('errorMsg', (msg) => alert(msg));

    socket.on('roomJoined', (data) => {
        document.getElementById('lobby-screen').classList.remove('active');
        document.getElementById('game-screen').classList.add('active');

        document.getElementById('display-room-code').innerText = data.roomId;
        document.getElementById('player-role').innerText = `${data.playerNum}번 ${data.isHost ? '(방장)' : ''}`;
        document.getElementById('my-money').innerText = data.money.toLocaleString();

        if (data.isHost) {
            document.getElementById('host-start-btn').style.display = 'block';
        }
    });

    socket.on('grantHost', () => {
        document.getElementById('host-start-btn').style.display = 'block';
        document.getElementById('player-role').innerText += ' (방장)';
        alert('방장이 퇴장하여 방장 권한을 위임받았습니다.');
    });

    socket.on('status', (msg) => {
        document.getElementById('status-text').innerText = msg;
    });

    socket.on('gameStart', (data) => {
        myCards = data.cards;
        openCardIndex = -1;
        finalCardIndex = -1;
        selectPhase = 'NONE';

        document.getElementById('my-money').innerText = data.money.toLocaleString();
        document.getElementById('total-pot').innerText = data.totalPot.toLocaleString();
        document.getElementById('opponent-cards').innerHTML = '<div class="card card-back">🎴</div>';
        document.getElementById('host-start-btn').style.display = 'none';

        setBetButtons(false);
    });

    socket.on('requestFirstCardSelect', () => {
        selectPhase = 'FIRST';
        setBetButtons(false);
        document.getElementById('card-instruction').innerText = "👉 공개할 1번째 카드를 터치하세요!";
        renderCards();
    });

    socket.on('receiveThirdCard', (data) => {
        myCards = data.allCards;
        openCardIndex = data.openCardIndex;
        renderCards();
    });

    socket.on('requestSecondCardSelect', () => {
        selectPhase = 'SECOND';
        setBetButtons(false);
        document.getElementById('card-instruction').innerText = "⚔️ 승부할 2번째 카드를 터치하세요! (1차 공개 패 제외)";
        renderCards();
    });

    socket.on('turnUpdate', (data) => {
        setBetButtons(data.isMyTurn);
    });

    socket.on('openOneCard', (openCardsInfo) => {
        const opArea = document.getElementById('opponent-cards');
        opArea.innerHTML = '';

        openCardsInfo.forEach(info => {
            const div = document.createElement('div');
            div.className = 'card';
            const kwangHtml = info.openCard.kwang ? '<span style="color:#c02727; font-size:12px; vertical-align:super;">光</span>' : '';
            div.innerHTML = info.openCard.month + kwangHtml;
            opArea.appendChild(div);
        });
    });

    socket.on('showdown', (data) => {
        setBetButtons(false);
        selectPhase = 'NONE';

        let resultMsg = `🏆 [${data.winnerName}] 승리! (${data.winningPot.toLocaleString()}원 획득)\n`;
        data.showdownData.forEach(p => {
            resultMsg += `\n👤 ${p.nickname}: [${p.jokboName}]`;
        });
        document.getElementById('status-text').innerText = resultMsg;

        if (document.getElementById('player-role').innerText.includes('방장')) {
            document.getElementById('host-start-btn').style.display = 'block';
        }
    });

    socket.on('updateMoney', (data) => {
        document.getElementById('my-money').innerText = data.money.toLocaleString();
    });

    socket.on('refillMoney', (data) => {
        document.getElementById('my-money').innerText = data.money.toLocaleString();
        alert('💸 파산 구제 지원금이 지급되었습니다.');
    });

    socket.on('updatePot', (data) => {
        document.getElementById('total-pot').innerText = data.totalPot.toLocaleString();
    });

    socket.on('opponentAction', (data) => {
        document.getElementById('status-text').innerText += `\n🔥 ${data.nickname}님: [${data.type}]`;
    });

    function setBetButtons(isMyTurn) {
        document.querySelectorAll('.bet-btn').forEach(btn => btn.disabled = !isMyTurn);
    }

    function renderCards() {
        const el = document.getElementById('player-cards');
        el.innerHTML = '';

        myCards.forEach((card, idx) => {
            const div = document.createElement('div');
            let classNames = 'card';

            if (idx === openCardIndex) {
                classNames += selectPhase === 'SECOND' ? ' disabled' : ' selected-open';
            } else if (idx === finalCardIndex) {
                classNames += ' selected-final';
            }

            div.className = classNames;
            const kwangHtml = card.kwang ? '<span style="color:#c02727; font-size:12px; vertical-align:super;">光</span>' : '';
            div.innerHTML = card.month + kwangHtml;

            if (idx === openCardIndex) {
                div.innerHTML += '<span class="badge">1차공개</span>';
            } else if (idx === finalCardIndex) {
                div.innerHTML += '<span class="badge">2차공개</span>';
            }

            bindMobileListener(div, () => onCardClick(idx));
            el.appendChild(div);
        });
    }

    function onCardClick(idx) {
        if (isProcessing) return;
        if (selectPhase === 'NONE') return;

        isProcessing = true;

        if (selectPhase === 'FIRST') {
            openCardIndex = idx;
            selectPhase = 'NONE';
            renderCards();
            socket.emit('selectOpenCard', openCardIndex);
        } else if (selectPhase === 'SECOND') {
            if (idx !== openCardIndex) {
                finalCardIndex = idx;
                selectPhase = 'NONE';
                renderCards();
                socket.emit('selectFinalCard', finalCardIndex);
            }
        }

        setTimeout(() => { isProcessing = false; }, 300);
    }

    function sendBet(type) {
        if (isProcessing) return;
        isProcessing = true;

        socket.emit('bet', { type });
        setBetButtons(false);

        setTimeout(() => { isProcessing = false; }, 300);
    }
</script>
</body>
</html>
