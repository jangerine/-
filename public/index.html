<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>실시간 멀티 3장 섯다</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { --card-red: #c02727; --gold: #ffd700; }
        body { font-family: sans-serif; background: #0b230c; color: white; margin: 0; padding: 15px; text-align: center; }
        .container { max-width: 400px; margin: 0 auto; background: #113812; border: 3px solid var(--gold); border-radius: 15px; padding: 15px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 10px; }
        .money-board { display: flex; justify-content: space-around; background: rgba(0,0,0,0.5); padding: 8px; border-radius: 8px; margin-bottom: 10px; font-weight: bold; color: var(--gold); }
        .host-control { background: rgba(255, 215, 0, 0.1); border: 1px dashed var(--gold); padding: 10px; border-radius: 8px; margin-bottom: 10px; display: none; }
        .host-control select { padding: 5px 10px; font-weight: bold; border-radius: 5px; }
        .card-area { display: flex; justify-content: center; gap: 8px; min-height: 80px; margin: 10px 0; }
        .card { width: 50px; height: 75px; background: var(--card-red); border: 2px solid #fff; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; color: #000; cursor: pointer; }
        .card.open { background: #fff; }
        .card.selected { border: 3px solid #00ffcc; transform: translateY(-5px); }
        .card-back { background: #780000; color: #aaa; border: 2px solid #ffcccc; cursor: default; }
        .status-box { background: rgba(0,0,0,0.4); padding: 10px; border-radius: 8px; min-height: 55px; margin: 10px 0; font-size: 14px; white-space: pre-line; }
        .jokbo-badge { background: #00ffcc; color: #000; font-weight: bold; padding: 5px 12px; border-radius: 20px; display: inline-block; margin-bottom: 5px; }
        .btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
        button { padding: 12px 0; font-weight: bold; border: none; border-radius: 6px; background: var(--gold); color: #000; }
        button:disabled { background: #444 !important; color: #888 !important; cursor: not-allowed; }
        .btn-die { background: #ff4d4d; color: white; grid-column: span 3; }
        .opponent-open-area { background: rgba(0,0,0,0.3); padding: 5px; border-radius: 8px; margin-bottom: 10px; font-size: 13px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>🎴 멀티 3장 섯다</div>
        <div id="player-role" style="color:var(--gold);">접속 중...</div>
    </div>

    <div class="money-board">
        <div>💵 내 잔액: <span id="my-money">100,000</span>원</div>
        <div>💰 총 판돈: <span id="total-pot">0</span>원</div>
    </div>

    <div id="host-panel" class="host-control">
        <span>👑 방장 권한: 게임 인원 설정</span>
        <select id="max-player-select" onchange="changeMaxPlayers()">
            <option value="2">2명</option>
            <option value="3">3명</option>
            <option value="4">4명</option>
        </select>
    </div>

    <div class="opponent-open-area">
        <div>👁️ 상대방 공개 패 (1차 베팅 후 노출)</div>
        <div class="card-area" id="opponent-cards">
            <div class="card card-back">🎴</div>
        </div>
    </div>

    <div class="status-box" id="status-text">서버 연결 대기 중...</div>

    <!-- 내 족보 표시 바 -->
    <div id="my-jokbo-container" style="display:none; margin-bottom: 5px;">
        <span class="jokbo-badge">💡 내 최고 족보: <span id="my-jokbo-text">-</span></span>
    </div>

    <div>👤 내 패 (선택한 1장만 상대에게 공개됨)</div>
    <div class="card-area" id="player-cards"></div>

    <div class="btn-grid">
        <button id="start-btn" style="grid-column: span 3;" onclick="requestGame()">게임 시작 (준비)</button>
        <button id="half-btn" class="bet-btn" onclick="sendBet('하프')" disabled>하프</button>
        <button id="call-btn" class="bet-btn" onclick="sendBet('콜')" disabled>콜</button>
        <button id="die-btn" class="bet-btn btn-die" onclick="sendBet('다이')" disabled>기권 (DIE)</button>
    </div>
</div>

<script>
    const socket = io();
    let myCards = [];
    let openCardIndex = 0;

    socket.on('init', (data) => {
        document.getElementById('player-role').innerText = `${data.playerNum}번 플레이어${data.isHost ? ' (방장)' : ''}`;
        document.getElementById('my-money').innerText = data.money.toLocaleString();
        
        if (data.isHost) {
            document.getElementById('host-panel').style.display = 'block';
        }
    });

    socket.on('updateMaxPlayers', (max) => {
        document.getElementById('max-player-select').value = max;
    });

    socket.on('status', (msg) => {
        document.getElementById('status-text').innerText = msg;
    });

    socket.on('gameStart', (data) => {
        myCards = data.cards;
        openCardIndex = 0;
        document.getElementById('my-money').innerText = data.money.toLocaleString();
        document.getElementById('total-pot').innerText = data.totalPot.toLocaleString();
        document.getElementById('opponent-cards').innerHTML = '<div class="card card-back">🎴</div>';
        
        // 내 족보 이름 바에 출력
        document.getElementById('my-jokbo-container').style.display = 'block';
        document.getElementById('my-jokbo-text').innerText = data.jokboName;

        renderCards();
        socket.emit('selectOpenCard', openCardIndex);

        const startBtn = document.getElementById('start-btn');
        startBtn.innerText = "게임 진행 중";
        startBtn.disabled = true;

        setBetButtons(data.isMyTurn);
    });

    socket.on('turnUpdate', (data) => {
        setBetButtons(data.isMyTurn);
    });

    socket.on('openOneCard', (openCardsInfo) => {
        const opArea = document.getElementById('opponent-cards');
        opArea.innerHTML = '';
        openCardsInfo.forEach(info => {
            const div = document.createElement('div');
            div.className = 'card open';
            div.innerText = info.openCard.month + (info.openCard.kwang ? '光' : '');
            opArea.appendChild(div);
        });
    });

    socket.on('showdown', (data) => {
        setBetButtons(false);
        let resultMsg = `🏆 [${data.winnerNum}번 플레이어] 승리! (${data.winningPot.toLocaleString()}원 획득)\n`;
        data.showdownData.forEach(p => {
            resultMsg += `\n👤 ${p.playerNum}번: [${p.jokboName}]`;
        });
        document.getElementById('status-text').innerText = resultMsg;

        const startBtn = document.getElementById('start-btn');
        startBtn.innerText = "다음 판 게임 시작 (준비)";
        startBtn.disabled = false;
    });

    socket.on('updateMoney', (data) => {
        document.getElementById('my-money').innerText = data.money.toLocaleString();
    });

    socket.on('refillMoney', (data) => {
        document.getElementById('my-money').innerText = data.money.toLocaleString();
        alert(`💸 파산 구제! 무료 지원금 ${data.refilledAmount.toLocaleString()}원이 지급되었습니다.`);
    });

    socket.on('updatePot', (data) => {
        document.getElementById('total-pot').innerText = data.totalPot.toLocaleString();
    });

    socket.on('opponentAction', (data) => {
        const betText = data.type === '다이' ? '기권' : `${data.type}`;
        document.getElementById('status-text').innerText += `\n🔥 ${data.playerNum}번 유저: [${betText}]`;
    });

    function setBetButtons(isMyTurn) {
        const betBtns = document.querySelectorAll('.bet-btn');
        betBtns.forEach(btn => btn.disabled = !isMyTurn);
    }

    function changeMaxPlayers() {
        const val = document.getElementById('max-player-select').value;
        socket.emit('setMaxPlayers', val);
    }

    function requestGame() {
        const startBtn = document.getElementById('start-btn');
        startBtn.disabled = true;
        startBtn.innerText = "준비 완료 (상대 대기 중...)";
        
        socket.emit('ready');
        document.getElementById('status-text').innerText = "준비 완료! 다른 플레이어를 기다립니다...";
    }

    function renderCards() {
        const el = document.getElementById('player-cards');
        el.innerHTML = '';
        myCards.forEach((card, idx) => {
            const div = document.createElement('div');
            const isSelected = (idx === openCardIndex);
            div.className = `card open ${isSelected ? 'selected' : ''}`;
            div.innerText = card.month + (card.kwang ? '光' : '');
            div.onclick = () => selectOpenCard(idx);
            el.appendChild(div);
        });
    }

    function selectOpenCard(idx) {
        openCardIndex = idx;
        renderCards();
        socket.emit('selectOpenCard', openCardIndex);
    }

    function sendBet(type) {
        socket.emit('bet', { type: type });
        setBetButtons(false);
    }
</script>
</body>
</html>
