<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3장 섯다 - 한게임 스타일 2.5D 통합판</title>
    <style>
        :root {
            --mat-green: #1a422b;
            --wood-dark: #1f0f08;
            --wood-frame: #3a1e05;
            --gold-bright: #ffd700;
            --gold: #dfb15b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: manipulation; }

        body {
            background-color: #0b0705;
            color: #fff;
            font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* 🎴 메인 게임 판 (한게임 섯다 2.5D 스케일) */
        .game-table {
            width: 960px;
            height: 600px;
            background: radial-gradient(circle, #255437 0%, var(--mat-green) 100%);
            border: 12px solid var(--wood-frame);
            border-radius: 20px;
            position: relative;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.85), 0 15px 40px rgba(0,0,0,0.9);
            overflow: hidden;
        }

        /* 중앙 판돈/상태 안내판 */
        .center-board {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 2;
        }

        .pot-area {
            background: rgba(0, 0, 0, 0.75);
            border: 2px solid var(--gold);
            padding: 8px 24px;
            border-radius: 20px;
            color: var(--gold-bright);
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 0 15px rgba(223, 177, 91, 0.3);
            margin-bottom: 8px;
        }

        .status-banner {
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 16px;
            border-radius: 12px;
            font-size: 13px;
            color: #fff;
            white-space: pre-line;
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* 상대방 플레이어 자리 (Top-View 배치) */
        .player-seat {
            position: absolute;
            width: 130px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--gold);
            border-radius: 8px;
            padding: 6px;
            text-align: center;
            font-size: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        
        .seat-top-left  { top: 25px; left: 160px; }
        .seat-top-mid   { top: 15px; left: 415px; }
        .seat-top-right { top: 25px; right: 160px; }
        .seat-mid-left  { top: 200px; left: 25px; }
        .seat-mid-right { top: 200px; right: 25px; }

        .seat-name { color: #ccc; font-weight: bold; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .seat-card-area { display: flex; justify-content: center; gap: 4px; min-height: 48px; }

        /* 화투패 표준 스타일 */
        .card {
            width: 32px;
            height: 48px;
            background: linear-gradient(135deg, #ffffff 0%, #f0e6d2 100%);
            border: 1px solid #111;
            border-radius: 4px;
            color: #111;
            font-weight: 900;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 1px 2px 4px rgba(0,0,0,0.5);
        }
        .card-back { background: #801010; border: 1px solid var(--gold); color: var(--gold); }
        .kwang-mark { color: #c02727; font-size: 9px; position: absolute; top: 1px; right: 2px; }

        /* 🕹️ 하단 컨트롤 패널 (한게임 UI 스타일) */
        .bottom-panel {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 145px;
            background: linear-gradient(180deg, #2b170c 0%, var(--wood-dark) 100%);
            border-top: 3px solid var(--gold);
            display: flex;
            align-items: center;
            padding: 0 15px;
            gap: 15px;
            z-index: 10;
        }

        /* 미니 족보표 */
        .jokbo-mini-table {
            width: 170px;
            height: 115px;
            background: rgba(0,0,0,0.6);
            border: 1px solid #665235;
            border-radius: 6px;
            font-size: 10px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            padding: 4px;
            gap: 2px;
            color: #aaa;
        }
        .jokbo-mini-table div {
            background: rgba(255,255,255,0.04);
            padding: 2px 4px;
            border-radius: 2px;
            display: flex;
            justify-content: space-between;
        }
        .jokbo-mini-table .highlight { color: var(--gold-bright); font-weight: bold; }

        /* 내 패 영역 */
        .my-hand-container {
            flex: 1;
            height: 115px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            border: 1px solid #44301a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 5px;
        }

        .my-hand-area {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .my-card {
            width: 54px;
            height: 82px;
            font-size: 20px;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .my-card:hover { transform: translateY(-5px); }
        .my-card.pending-select {
            border: 3px dashed #ffea00 !important;
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 0 12px #ffea00;
        }
        .my-card.selected-open { border: 3px solid #00ffcc; transform: translateY(-4px); }

        /* 3장 중 족보 선택 UI 오버레이 */
        .jokbo-selector {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 10, 5, 0.95);
            border-radius: 8px;
            padding: 6px;
            flex-direction: column;
            justify-content: space-around;
            z-index: 15;
        }
        .jokbo-selector.active { display: flex; }
        .jokbo-btn {
            background: #3d2112;
            border: 1px solid var(--gold);
            color: var(--gold-bright);
            padding: 6px 10px;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
        }
        .jokbo-btn:hover { background: var(--gold); color: #000; }

        /* 우측 베팅 버튼 구역 */
        .bet-action-group {
            display: grid;
            grid-template-columns: repeat(2, 85px);
            gap: 6px;
        }
        .btn-game {
            padding: 12px 0;
            font-weight: bold;
            font-size: 13px;
            border-radius: 6px;
            border: 1px solid var(--gold);
            background: linear-gradient(180deg, #edd293 0%, #c59740 100%);
            color: #1b0e07;
            cursor: pointer;
        }
        .btn-game:disabled { background: #3a3a3a !important; color: #777 !important; border-color: #555 !important; }
        .btn-die { background: linear-gradient(180deg, #e75c5c 0%, #b82323 100%); color: #fff; grid-column: span 2; }
        .btn-start { background: linear-gradient(180deg, #4ea8de 0%, #0077b6 100%); color: white; grid-column: span 2; }
    </style>
</head>
<body>

<div class="game-table">
    <!-- 중앙 판돈 및 진행 상태 -->
    <div class="center-board">
        <div class="pot-area">💰 총 판돈: <span id="total-pot">0</span>원</div>
        <div class="status-banner" id="status-text">🎮 게임 시작 버튼을 눌러주세요!</div>
    </div>

    <!-- 상대방들 (탑뷰 배치) -->
    <div class="player-seat seat-top-left">
        <div class="seat-name">포커킹</div>
        <div class="seat-card-area"><div class="card card-back">🎴</div><div class="card card-back">🎴</div></div>
    </div>
    <div class="player-seat seat-top-mid" id="ai-seat">
        <div class="seat-name">🤖 AI 타짜</div>
        <div class="seat-card-area" id="ai-cards">
            <div class="card card-back">🎴</div><div class="card card-back">🎴</div>
        </div>
    </div>
    <div class="player-seat seat-top-right">
        <div class="seat-name">김화투</div>
        <div class="seat-card-area"><div class="card card-back">🎴</div><div class="card card-back">🎴</div></div>
    </div>
    <div class="player-seat seat-mid-left">
        <div class="seat-name">초보자</div>
        <div class="seat-card-area"><div class="card card-back">🎴</div><div class="card card-back">🎴</div></div>
    </div>
    <div class="player-seat seat-mid-right">
        <div class="seat-name">짝귀</div>
        <div class="seat-card-area"><div class="card card-back">🎴</div><div class="card card-back">🎴</div></div>
    </div>

    <!-- 하단 내 컨트롤 패널 -->
    <div class="bottom-panel">
        <!-- 미니 족보 참조표 -->
        <div class="jokbo-mini-table">
            <div class="highlight"><span>1. 38광땡</span></div><div class="highlight"><span>7. 땡</span></div>
            <div><span>2. 광땡</span></div><div><span>8. 알리</span></div>
            <div><span>3. 암행어사</span></div><div><span>9. 독사</span></div>
            <div><span>4. 땡잡이</span></div><div><span>10. 구빙</span></div>
            <div><span>5. 멍구사</span></div><div><span>11. 장빙</span></div>
            <div><span>6. 구사</span></div><div><span>12. 끗</span></div>
        </div>

        <!-- 내 패 영역 및 족보 선택 오버레이 -->
        <div class="my-hand-container">
            <div style="font-size:11px; color:var(--gold); margin-bottom:4px;">👤 내 잔액: <span id="my-money">100,000</span>원</div>
            <div class="my-hand-area" id="player-cards"></div>

            <!-- 3장 패 중 족보 선택 가이드 -->
            <div class="jokbo-selector" id="jokbo-selector">
                <div style="font-size: 10px; color: var(--gold-bright); font-weight: bold;">🎯 승부할 조합 1개를 터치하세요:</div>
                <div id="jokbo-options" style="display:flex; flex-direction:column; gap:3px;"></div>
            </div>
        </div>

        <!-- 우측 베팅 버튼 -->
        <div class="bet-action-group">
            <button id="start-btn" class="btn-game btn-start" onclick="startRound()">게임 시작</button>
            <button id="half-btn" class="btn-game" onclick="handleBet('하프')" disabled>하프</button>
            <button id="call-btn" class="btn-game" onclick="handleBet('콜')" disabled>콜</button>
            <button id="die-btn" class="btn-game btn-die" onclick="handleBet('다이')" disabled>다이</button>
        </div>
    </div>
</div>

<script>
    // 🔊 웹 오디오 API 기반 '착!' 오디오 효과음
    function playCardSound() {
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const ctx = new AudioContext();

            // 1. 타격음 (화투패 부딪히는 소리)
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(800, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.08);

            gain.gain.setValueAtTime(1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);

            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.08);

            // 2. 마찰음 (손 잡음 효과)
            const bufferSize = ctx.sampleRate * 0.05;
            const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

            const noise = ctx.createBufferSource();
            noise.buffer = buffer;
            const noiseGain = ctx.createGain();
            noiseGain.gain.setValueAtTime(0.3, ctx.currentTime);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);

            noise.connect(noiseGain);
            noiseGain.connect(ctx.destination);
            noise.start();
        } catch (e) {}
    }

    // 게임 상태 변수
    let playerMoney = 100000;
    let aiMoney = 100000;
    let pot = 0;

    let deck = [];
    let myCards = [];
    let aiHand = [];

    let openCardIndex = -1;
    let pendingSelectIndex = -1;
    let selectPhase = 'NONE';
    let selectedJokbo = null;
    let aiOpenIndex = -1;

    // 🎴 덱 생성 함수
    function createDeck() {
        const d = [];
        for (let month = 1; month <= 10; month++) {
            const hasKwang = (month === 1 || month === 3 || month === 8);
            const isYeol = (month === 4 || month === 7 || month === 9);
            d.push({ month, kwang: hasKwang, yeol: isYeol });
            d.push({ month, kwang: false, yeol: false });
        }
        for (let i = d.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [d[i], d[j]] = [d[j], d[i]];
        }
        return d;
    }

    // 🎴 족보 판정 로직 (특수패 포함)
    function evaluateJokbo(card1, card2) {
        const c1 = card1.kwang ? { ...card1 } : { ...card2 };
        const c2 = card1.kwang ? { ...card2 } : { ...card1 };

        if ((c1.month === 3 && c1.kwang && c2.month === 8 && c2.kwang) || 
            (c2.month === 3 && c2.kwang && c1.month === 8 && c1.kwang)) {
            return { rank: 100, name: "38광땡", type: '38KWANG' };
        }
        if (c1.kwang && c2.kwang && ((c1.month === 1 && c2.month === 3) || (c1.month === 1 && c2.month === 8))) {
            return { rank: 90, name: "광땡", type: 'KWANG' };
        }

        if (card1.month === card2.month) {
            return { rank: 70 + card1.month, name: `${card1.month}땡`, type: 'DDANG', num: card1.month };
        }

        const m1 = card1.month;
        const m2 = card2.month;
        const combo = [m1, m2].sort((a, b) => a - b).join(',');

        if ((card1.month === 4 && card1.yeol && card2.month === 7 && card2.yeol) ||
            (card2.month === 4 && card2.yeol && card1.month === 7 && card1.yeol)) {
            return { rank: 0, name: "암행어사", type: 'INSPECTOR' };
        }
        if ((card1.month === 3 && card1.kwang && card2.month === 7 && card2.yeol) ||
            (card2.month === 3 && card2.kwang && card1.month === 7 && card1.yeol)) {
            return { rank: 0, name: "땡잡이", type: 'DDANG_CATCHER' };
        }
        if ((card1.month === 4 && card1.yeol && card2.month === 9 && card2.yeol) ||
            (card2.month === 4 && card2.yeol && card1.month === 9 && card1.yeol)) {
            return { rank: 0, name: "멍텅구리 구사", type: 'DUMB_GUSA' };
        }
        if (combo === '4,9') return { rank: 0, name: "구사", type: 'GUSA' };

        if (combo === '1,2') return { rank: 60, name: "알리", type: 'NORMAL' };
        if (combo === '1,4') return { rank: 59, name: "독사", type: 'NORMAL' };
        if (combo === '1,9') return { rank: 58, name: "구빙", type: 'NORMAL' };
        if (combo === '1,10') return { rank: 57, name: "장빙", type: 'NORMAL' };
        if (combo === '4,10') return { rank: 56, name: "장사", type: 'NORMAL' };
        if (combo === '4,6') return { rank: 55, name: "세륙", type: 'NORMAL' };

        const kkot = (m1 + m2) % 10;
        if (kkot === 0) return { rank: 1, name: "망통", type: 'NORMAL' };
        return { rank: 10 + kkot, name: `${kkot}끗`, type: 'NORMAL' };
    }

    function getPossibleJokbos(cards3) {
        const combinations = [
            { cards: [cards3[0], cards3[1]], indices: [0, 1] },
            { cards: [cards3[0], cards3[2]], indices: [0, 2] },
            { cards: [cards3[1], cards3[2]], indices: [1, 2] }
        ];

        return combinations.map(comb => {
            const evalResult = evaluateJokbo(comb.cards[0], comb.cards[1]);
            return { ...evalResult, cards: comb.cards, usedIndices: comb.indices };
        });
    }

    // 🎮 라운드 시작
    function startRound() {
        playCardSound();
        document.getElementById('start-btn').style.display = 'none';
        document.getElementById('jokbo-selector').classList.remove('active');

        deck = createDeck();
        myCards = [deck.pop(), deck.pop()];
        aiHand = [deck.pop(), deck.pop()];

        pot = 2000;
        playerMoney -= 1000;
        aiMoney -= 1000;

        openCardIndex = -1;
        pendingSelectIndex = -1;
        selectedJokbo = null;

        document.getElementById('my-money').innerText = playerMoney.toLocaleString();
        document.getElementById('total-pot').innerText = pot.toLocaleString();
        
        document.getElementById('ai-cards').innerHTML = '<div class="card card-back">🎴</div><div class="card card-back">🎴</div>';
        document.getElementById('status-text').innerText = "🎴 [1단계] 바닥에 공개할 1번째 카드를 선택하세요.";
        
        selectPhase = 'FIRST';
        renderCards();
    }

    // 내 손패 렌더링
    function renderCards() {
        const el = document.getElementById('player-cards');
        el.innerHTML = '';

        myCards.forEach((card, idx) => {
            const div = document.createElement('div');
            let classNames = 'card my-card';

            if (idx === openCardIndex) classNames += ' selected-open';
            else if (idx === pendingSelectIndex) classNames += ' pending-select';

            div.className = classNames;
            const kwangHtml = card.kwang ? '<span class="kwang-mark">光</span>' : '';
            div.innerHTML = card.month + kwangHtml;

            div.onclick = () => onCardClick(idx);
            el.appendChild(div);
        });
    }

    // 카드 선택 터치 핸들러
    function onCardClick(idx) {
        if (selectPhase !== 'FIRST') return;

        if (pendingSelectIndex !== idx) {
            pendingSelectIndex = idx;
            renderCards();
            return;
        }

        openCardIndex = idx;
        pendingSelectIndex = -1;
        selectPhase = 'NONE';

        playCardSound();
        renderCards();

        // AI 오픈 카드 처리
        aiOpenIndex = Math.floor(Math.random() * 2);
        const aiOpenCard = aiHand[aiOpenIndex];
        const aiArea = document.getElementById('ai-cards');
        aiArea.innerHTML = '';

        const div = document.createElement('div');
        div.className = 'card';
        const kwangHtml = aiOpenCard.kwang ? '<span class="kwang-mark">光</span>' : '';
        div.innerHTML = aiOpenCard.month + kwangHtml;
        
        aiArea.appendChild(div);
        aiArea.innerHTML += '<div class="card card-back">🎴</div>';

        document.getElementById('status-text').innerText = "🔥 [1차 베팅] 베팅 버튼을 선택하세요.";
        setBetButtons(true);
    }

    function handleBet(type) {
        playCardSound();
        setBetButtons(false);

        if (type === '다이') {
            document.getElementById('status-text').innerText = "🏳️ 기권하셨습니다. AI 승리!";
            aiMoney += pot;
            finishRound();
            return;
        }

        if (type === '하프') {
            const raise = Math.floor(pot / 2);
            pot += raise;
            playerMoney -= raise;
        }

        document.getElementById('my-money').innerText = playerMoney.toLocaleString();
        document.getElementById('total-pot').innerText = pot.toLocaleString();

        if (myCards.length === 2) {
            setTimeout(() => {
                myCards.push(deck.pop());
                aiHand.push(deck.pop());
                playCardSound();
                renderCards();
                showJokboSelection();
            }, 400);
        } else {
            setTimeout(showdown, 600);
        }
    }

    // 3장 완성 후 족보 조합 선택 UI
    function showJokboSelection() {
        document.getElementById('status-text').innerText = "🎴 3장 수령 완료!\n최종 승부할 족보 1개를 선택하세요.";
        
        const possibleJokbos = getPossibleJokbos(myCards);
        const container = document.getElementById('jokbo-selector');
        const optionsEl = document.getElementById('jokbo-options');
        optionsEl.innerHTML = '';

        possibleJokbos.forEach((jokbo, idx) => {
            const btn = document.createElement('div');
            btn.className = 'jokbo-btn';
            const c1 = jokbo.cards[0].month + (jokbo.cards[0].kwang ? '光' : '');
            const c2 = jokbo.cards[1].month + (jokbo.cards[1].kwang ? '光' : '');
            
            btn.innerHTML = `<span>조합 ${idx + 1}: <strong>[${jokbo.name}]</strong></span><span style="color:#aaa;">(${c1}, ${c2})</span>`;
            
            btn.onclick = () => {
                playCardSound();
                selectedJokbo = jokbo;
                container.classList.remove('active');
                document.getElementById('status-text').innerText = `🎯 [${jokbo.name}] 선택 완료!\n최종 승부 베팅을 완료하세요.`;
                setBetButtons(true);
            };

            optionsEl.appendChild(btn);
        });

        container.classList.add('active');
    }

    // 최종 승부 비교
    function showdown() {
        const aiJokbos = getPossibleJokbos(aiHand);
        aiJokbos.sort((a, b) => b.rank - a.rank);
        const aiBestJokbo = aiJokbos[0];

        let pEval = selectedJokbo;
        let aiEval = aiBestJokbo;

        let winner = null;

        const checkSpecialRule = (my, opp) => {
            if (my.type === 'GUSA' && opp.rank <= 60) return 'DRAW';
            if (my.type === 'DUMB_GUSA' && opp.rank <= 79) return 'DRAW';
            if (my.type === 'DDANG_CATCHER' && opp.type === 'DDANG' && opp.num < 10) return 'WIN';
            if (my.type === 'INSPECTOR' && opp.type === 'KWANG') return 'WIN';
            return null;
        };

        const pSpecial = checkSpecialRule(pEval, aiEval);
        const aiSpecial = checkSpecialRule(aiEval, pEval);

        if (pSpecial === 'WIN' || aiSpecial === 'DRAW') winner = (pSpecial === 'WIN') ? 'PLAYER' : 'DRAW';
        else if (aiSpecial === 'WIN' || pSpecial === 'DRAW') winner = (aiSpecial === 'WIN') ? 'AI' : 'DRAW';
        else {
            if (pEval.rank > aiEval.rank) winner = 'PLAYER';
            else if (pEval.rank < aiEval.rank) winner = 'AI';
            else winner = 'DRAW';
        }

        let msg = `🏆 [승부 결과]\n내 족보: [${pEval.name}] vs AI: [${aiEval.name}]\n`;

        if (winner === 'PLAYER') {
            msg += `🎉 승리! (${pot.toLocaleString()}원 획득)`;
            playerMoney += pot;
        } else if (winner === 'AI') {
            msg += `💀 AI 승리!`;
            aiMoney += pot;
        } else {
            msg += `🤝 구사/무승부! 판돈 반반 분할`;
            playerMoney += Math.floor(pot / 2);
            aiMoney += Math.floor(pot / 2);
        }

        document.getElementById('status-text').innerText = msg;
        finishRound();
    }

    function setBetButtons(isMyTurn) {
        document.getElementById('half-btn').disabled = !isMyTurn;
        document.getElementById('call-btn').disabled = !isMyTurn;
        document.getElementById('die-btn').disabled = !isMyTurn;
    }

    function finishRound() {
        document.getElementById('my-money').innerText = playerMoney.toLocaleString();
        document.getElementById('total-pot').innerText = "0";

        const startBtn = document.getElementById('start-btn');
        startBtn.style.display = 'block';
        startBtn.innerText = "다음 판 시작";
    }
</script>
</body>
</html>
