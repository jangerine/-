<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3장 섯다 - 멀티플레이 완전판</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --mat-green: #1a422b;
            --wood-dark: #1f0f08;
            --wood-frame: #3a1e05;
            --gold-bright: #ffd700;
            --gold: #dfb15b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: manipulation; }

        body {
            background-color: #0b0705;
            color: #fff;
            font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* 📱 모바일 스케일링 래퍼 */
        .game-scaler {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 🚪 로비 오버레이 */
        .lobby-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 5, 2, 0.95);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .lobby-card {
            background: #2b170c;
            border: 2px solid var(--gold);
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }

        .lobby-card h2 { color: var(--gold-bright); margin-bottom: 15px; font-size: 20px; }
        .lobby-card input {
            width: 100%; padding: 10px; margin-bottom: 10px;
            border-radius: 6px; border: 1px solid var(--gold);
            background: #150a04; color: #fff; text-align: center; font-size: 14px;
        }

        /* 🎴 고정 비율 게임 테이블 */
        .game-table {
            width: 960px;
            height: 600px;
            background: radial-gradient(circle, #255437 0%, var(--mat-green) 100%);
            border: 12px solid var(--wood-frame);
            border-radius: 20px;
            position: relative;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.85), 0 15px 40px rgba(0,0,0,0.9);
            overflow: hidden;
            transform-origin: center center;
            flex-shrink: 0;
        }

        .center-board {
            position: absolute; top: 38%; left: 50%;
            transform: translate(-50%, -50%); text-align: center; z-index: 2;
            width: 80%;
        }

        .pot-area {
            background: rgba(0, 0, 0, 0.75); border: 2px solid var(--gold);
            padding: 8px 24px; border-radius: 20px; color: var(--gold-bright);
            font-weight: bold; font-size: 18px; margin-bottom: 8px; display: inline-block;
        }

        .status-banner {
            background: rgba(0, 0, 0, 0.6); padding: 8px 16px; border-radius: 12px;
            font-size: 14px; color: #fff; white-space: pre-line; border: 1px solid rgba(255,255,255,0.2);
            margin: 0 auto; max-width: 400px;
        }

        /* 상대방 영역 */
        .player-seat {
            position: absolute; width: 140px; background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--gold); border-radius: 8px; padding: 6px;
            text-align: center; font-size: 12px;
        }
        
        .seat-top-mid { top: 15px; left: 50%; transform: translateX(-50%); }
        .seat-name { color: #ccc; font-weight: bold; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .seat-card-area { display: flex; justify-content: center; gap: 4px; min-height: 48px; }

        /* 화투패 */
        .card {
            width: 32px; height: 48px;
            background: linear-gradient(135deg, #ffffff 0%, #f0e6d2 100%);
            border: 1px solid #111; border-radius: 4px; color: #111;
            font-weight: 900; font-size: 14px; display: flex;
            align-items: center; justify-content: center; position: relative;
        }
        .card-back { background: #801010; border: 1px solid var(--gold); color: var(--gold); }
        .kwang-mark { color: #c02727; font-size: 9px; position: absolute; top: 1px; right: 2px; }

        /* 하단 제어판 */
        .bottom-panel {
            position: absolute; bottom: 0; left: 0; right: 0; height: 145px;
            background: linear-gradient(180deg, #2b170c 0%, var(--wood-dark) 100%);
            border-top: 3px solid var(--gold); display: flex; align-items: center;
            padding: 0 15px; gap: 12px; z-index: 10;
        }

        .jokbo-mini-table {
            width: 160px; height: 115px; background: rgba(0,0,0,0.6);
            border: 1px solid #665235; border-radius: 6px; font-size: 10px;
            display: grid; grid-template-columns: 1fr 1fr; padding: 4px; gap: 2px; color: #aaa;
            flex-shrink: 0;
        }
        .jokbo-mini-table div { background: rgba(255,255,255,0.04); padding: 2px 4px; border-radius: 2px; }
        .jokbo-mini-table .highlight { color: var(--gold-bright); font-weight: bold; }

        .my-hand-container {
            flex: 1; height: 115px; background: rgba(0, 0, 0, 0.4);
            border-radius: 8px; border: 1px solid #44301a; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            position: relative; padding: 5px; min-width: 0;
        }

        .my-hand-area { display: flex; gap: 8px; align-items: center; }

        .my-card {
            width: 50px; height: 76px; font-size: 18px; border-radius: 6px; cursor: pointer;
            transition: transform 0.15s ease; flex-shrink: 0;
        }
        .my-card.pending-select { border: 3px dashed #ffea00 !important; transform: translateY(-8px); }

        .jokbo-selector {
            display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 10, 5, 0.95); border-radius: 8px; padding: 6px;
            flex-direction: column; justify-content: space-around; z-index: 15;
        }
        .jokbo-selector.active { display: flex; }
        .jokbo-btn {
            background: #3d2112; border: 1px solid var(--gold); color: var(--gold-bright);
            padding: 6px 10px; font-size: 11px; border-radius: 4px; cursor: pointer;
            display: flex; justify-content: space-between;
        }

        .bet-action-group { display: grid; grid-template-columns: repeat(2, 85px); gap: 6px; flex-shrink: 0; }
        .btn-game {
            padding: 12px 0; font-weight: bold; font-size: 13px; border-radius: 6px;
            border: 1px solid var(--gold); background: linear-gradient(180deg, #edd293 0%, #c59740 100%);
            color: #1b0e07; cursor: pointer; text-align: center;
        }
        .btn-game:disabled { background: #3a3a3a !important; color: #777 !important; border-color: #555 !important; }
        .btn-die { background: linear-gradient(180deg, #e75c5c 0%, #b82323 100%); color: #fff; grid-column: span 2; }
        .btn-start { background: linear-gradient(180deg, #4ea8de 0%, #0077b6 100%); color: white; grid-column: span 2; }
    </style>
</head>
<body>

<div class="game-scaler">
    <div class="lobby-overlay" id="lobby-screen">
        <div class="lobby-card">
            <h2>🎴 멀티 섯다 대전</h2>
            <input type="text" id="nickname-input" placeholder="닉네임 입력">
            
            <div style="border-top:1px dashed var(--gold); margin:10px 0; padding-top:10px;">
                <button class="btn-game btn-start" style="width:100%; margin-bottom:8px;" onclick="createRoom()">🏠 방 만들기 (방장)</button>
            </div>

            <div>
                <input type="text" id="room-code-input" placeholder="방 코드 4자리 입력">
                <button class="btn-game" style="width:100%;" onclick="joinRoom()">🚪 방 참여하기</button>
            </div>
        </div>
    </div>

    <div class="game-table" id="game-table">
        <div class="center-board">
            <div style="font-size:12px; color:var(--gold); margin-bottom:2px;">방 코드: <span id="display-room-code">-</span></div>
            <div class="pot-area">💰 총 판돈: <span id="total-pot">0</span>원</div>
            <div class="status-banner" id="status-text">상대방 접속을 기다리는 중입니다...</div>
        </div>

        <div class="player-seat seat-top-mid" id="opponent-seat">
            <div class="seat-name" id="opponent-name">대기 중...</div>
            <div class="seat-card-area" id="opponent-cards">
                <div class="card card-back">🎴</div><div class="card card-back">🎴</div>
            </div>
        </div>

        <div class="bottom-panel">
            <div class="jokbo-mini-table">
                <div class="highlight"><span>1. 38광땡</span></div><div class="highlight"><span>7. 땡</span></div>
                <div><span>2. 광땡</span></div><div><span>8. 알리</span></div>
                <div><span>3. 암행어사</span></div><div><span>9. 독사</span></div>
                <div><span>4. 땡잡이</span></div><div><span>10. 구빙</span></div>
                <div><span>5. 멍구사</span></div><div><span>11. 장빙</span></div>
                <div><span>6. 구사</span></div><div><span>12. 끗</span></div>
            </div>

            <div class="my-hand-container">
                <div style="font-size:11px; color:var(--gold); margin-bottom:4px;">👤 내 잔액: <span id="my-money">100,000</span>원</div>
                <div class="my-hand-area" id="player-cards"></div>

                <div class="jokbo-selector" id="jokbo-selector">
                    <div style="font-size: 10px; color: var(--gold-bright); font-weight: bold;">🎯 승부할 조합 1개를 터치하세요:</div>
                    <div id="jokbo-options" style="display:flex; flex-direction:column; gap:3px;"></div>
                </div>
            </div>

            <div class="bet-action-group">
                <button id="start-btn" class="btn-game btn-start" onclick="requestStartGame()" style="display:none;">게임 시작</button>
                <button id="half-btn" class="btn-game" onclick="sendBet('하프')" disabled>하프</button>
                <button id="call-btn" class="btn-game" onclick="sendBet('콜')" disabled>콜</button>
                <button id="die-btn" class="btn-game btn-die" onclick="sendBet('다이')" disabled>다이</button>
            </div>
        </div>
    </div>
</div>

<script>
    function resizeGame() {
        const table = document.getElementById('game-table');
        const scale = Math.min(window.innerWidth / 960, window.innerHeight / 600) * 0.96;
        table.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', resizeGame);
    window.addEventListener('load', resizeGame);
    resizeGame();

    const socket = io();
    let myRoomCode = "", isHost = false, myCards = [], pendingSelectIndex = -1, selectPhase = 'NONE';

    function playSound() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.frequency.setValueAtTime(800, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.08);
            gain.gain.setValueAtTime(1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(ctx.currentTime + 0.08);
        } catch(e){}
    }

    function createRoom() {
        socket.emit('createRoom', { nickname: document.getElementById('nickname-input').value.trim() || "방장" });
    }

    function joinRoom() {
        const roomCode = document.getElementById('room-code-input').value.trim();
        if (!roomCode) return alert("방 코드를 입력하세요!");
        socket.emit('joinRoom', { nickname: document.getElementById('nickname-input').value.trim() || "게스트", roomCode });
    }

    socket.on('roomCreated', (data) => {
        myRoomCode = data.roomCode; isHost = true;
        document.getElementById('lobby-screen').style.display = 'none';
        document.getElementById('display-room-code').innerText = myRoomCode;
        document.getElementById('start-btn').style.display = 'block';
    });

    socket.on('roomJoined', (data) => {
        myRoomCode = data.roomCode; isHost = false;
        document.getElementById('lobby-screen').style.display = 'none';
        document.getElementById('display-room-code').innerText = myRoomCode;
    });

    socket.on('playerJoined', (data) => {
        document.getElementById('opponent-name').innerText = data.opponentName;
        document.getElementById('status-text').innerText = "상대방이 입장했습니다!\n'게임 시작'을 눌러주세요.";
    });

    socket.on('errorMsg', (msg) => alert(msg));

    function requestStartGame() {
        socket.emit('startGame', { roomCode: myRoomCode });
    }

    socket.on('roundStarted', (data) => {
        playSound();
        document.getElementById('start-btn').style.display = 'none';
        myCards = data.yourHand;
        document.getElementById('total-pot').innerText = data.pot.toLocaleString();
        document.getElementById('my-money').innerText = data.yourMoney.toLocaleString();
        document.getElementById('status-text').innerText = "🎴 공개할 1번째 카드를 선택하세요.";
        selectPhase = 'FIRST';
        renderCards();
    });

    function renderCards() {
        const el = document.getElementById('player-cards');
        el.innerHTML = '';
        myCards.forEach((card, idx) => {
            const div = document.createElement('div');
            div.className = 'card my-card' + (idx === pendingSelectIndex ? ' pending-select' : '');
            div.innerHTML = card.month + (card.kwang ? '<span class="kwang-mark">光</span>' : '');
            div.onclick = () => {
                if (selectPhase !== 'FIRST') return;
                if (pendingSelectIndex !== idx) { pendingSelectIndex = idx; renderCards(); return; }
                playSound();
                selectPhase = 'NONE';
                socket.emit('selectOpenCard', { roomCode: myRoomCode, cardIndex: idx });
            };
            el.appendChild(div);
        });
    }

    socket.on('openCardRevealed', (data) => {
        const opArea = document.getElementById('opponent-cards');
        opArea.innerHTML = `<div class="card">${data.opponentOpenCard.month}${data.opponentOpenCard.kwang ? '<span class="kwang-mark">光</span>' : ''}</div><div class="card card-back">🎴</div>`;
        document.getElementById('status-text').innerText = data.isMyTurn ? "🔥 [내 차례] 베팅을 진행하세요." : "⏳ 상대방 베팅 대기 중...";
        setBetButtons(data.isMyTurn);
    });

    function sendBet(type) {
        playSound(); setBetButtons(false);
        socket.emit('playerBet', { roomCode: myRoomCode, betType: type });
    }

    socket.on('updateBetState', (data) => {
        document.getElementById('total-pot').innerText = data.pot.toLocaleString();
        document.getElementById('my-money').innerText = data.yourMoney.toLocaleString();
        document.getElementById('status-text').innerText = data.isMyTurn ? "🔥 [내 차례] 베팅을 진행하세요." : "⏳ 상대방 베팅 대기 중...";
        setBetButtons(data.isMyTurn);
    });

    socket.on('receiveThirdCard', (data) => {
        playSound();
        myCards.push(data.thirdCard);
        renderCards();

        const container = document.getElementById('jokbo-selector');
        const optionsEl = document.getElementById('jokbo-options');
        optionsEl.innerHTML = '';

        data.possibleJokbos.forEach((jokbo, idx) => {
            const btn = document.createElement('div');
            btn.className = 'jokbo-btn';
            btn.innerHTML = `<span>조합 ${idx + 1}: <strong>[${jokbo.name}]</strong></span>`;
            btn.onclick = () => {
                playSound();
                container.classList.remove('active');
                socket.emit('selectFinalJokbo', { roomCode: myRoomCode, jokbo });
            };
            optionsEl.appendChild(btn);
        });
        container.classList.add('active');
    });

    socket.on('showdownResult', (data) => {
        document.getElementById('status-text').innerText = `🏆 [승부 결과]\n내 족보: [${data.myJokbo}] vs 상대: [${data.oppJokbo}]\n${data.resultMessage}`;
        document.getElementById('my-money').innerText = data.yourMoney.toLocaleString();
        document.getElementById('total-pot').innerText = "0";

        if (isHost) {
            const startBtn = document.getElementById('start-btn');
            startBtn.style.display = 'block';
            startBtn.innerText = "다음 판 시작";
        }
    });

    function setBetButtons(isMyTurn) {
        document.getElementById('half-btn').disabled = !isMyTurn;
        document.getElementById('call-btn').disabled = !isMyTurn;
        document.getElementById('die-btn').disabled = !isMyTurn;
    }
</script>
</body>
</html>
