<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>실시간 멀티 섯다 (최대 4인)</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { --card-red: #c02727; --gold: #ffd700; }
        body { font-family: sans-serif; background: #0b230c; color: white; margin: 0; padding: 15px; text-align: center; }
        .container { max-width: 400px; margin: 0 auto; background: #113812; border: 3px solid var(--gold); border-radius: 15px; padding: 15px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 10px; }
        .money-board { display: flex; justify-content: space-around; background: rgba(0,0,0,0.5); padding: 8px; border-radius: 8px; margin-bottom: 10px; font-weight: bold; color: var(--gold); }
        .host-control { background: rgba(255, 215, 0, 0.1); border: 1px dashed var(--gold); padding: 10px; border-radius: 8px; margin-bottom: 10px; display: none; }
        .host-control select { padding: 5px 10px; font-weight: bold; border-radius: 5px; }
        .card-area { display: flex; justify-content: center; gap: 8px; min-height: 80px; margin: 10px 0; }
        .card { width: 50px; height: 75px; background: var(--card-red); border: 2px solid #fff; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; color: #000; }
        .card.open { background: #fff; }
        .card.selected { border: 3px solid #00ffcc; transform: translateY(-5px); }
        .card-back { background: #780000; color: #aaa; border: 2px solid #ffcccc; }
        .status-box { background: rgba(0,0,0,0.4); padding: 10px; border-radius: 8px; min-height: 45px; margin: 10px 0; font-size: 14px; white-space: pre-line; }
        .btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
        button { padding: 12px 0; font-weight: bold; border: none; border-radius: 6px; background: var(--gold); color: #000; }
        button:disabled { background: #555; color: #888; }
        .btn-die { background: #ff4d4d; color: white; grid-column: span 3; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>🎴 멀티 섯다</div>
        <div id="player-role" style="color:var(--gold);">접속 중...</div>
    </div>

    <div class="money-board">
        <div>💵 내 잔액: <span id="my-money">100,000</span>원</div>
        <div>💰 총 판돈: <span id="total-pot">0</span>원</div>
    </div>

    <div id="host-panel" class="host-control">
        <span>👑 방장 권한: 게임 인원 설정</span>
        <select id="max-player-select" onchange="changeMaxPlayers()">
            <option value="2">2명</option>
            <option value="3">3명</option>
            <option value="4">4명</option>
        </select>
    </div>

    <div>🤖 상대 플레이어들</div>
    <div class="card-area">
        <div class="card card-back">🎴</div>
        <div class="card card-back">🎴</div>
    </div>

    <div class="status-box" id="status-text">서버 연결 대기 중...</div>

    <div>👤 내 패 (2장 선택)</div>
    <div class="card-area" id="player-cards"></div>

    <div class="btn-grid">
        <button id="start-btn" style="grid-column: span 3;" onclick="requestGame()">게임 시작 (준비)</button>
        <button id="half-btn" onclick="sendBet('하프')" disabled>하프</button>
        <button id="call-btn" onclick="sendBet('콜')" disabled>콜</button>
        <button id="die-btn" class="btn-die" onclick="sendBet('다이')" disabled>기권 (DIE)</button>
    </div>
</div>

<script>
    const socket = io();
    let myCards = [];
    let selectedIndices = [];

    socket.on('init', (data) => {
        document.getElementById('player-role').innerText = `${data.playerNum}번 플레이어${data.isHost ? ' (방장)' : ''}`;
        document.getElementById('my-money').innerText = data.money.toLocaleString();
        
        if (data.isHost) {
            document.getElementById('host-panel').style.display = 'block';
        }
    });

    socket.on('updateMaxPlayers', (max) => {
        document.getElementById('max-player-select').value = max;
    });

    socket.on('status', (msg) => {
        document.getElementById('status-text').innerText = msg;
    });

    socket.on('gameStart', (data) => {
        myCards = data.cards;
        selectedIndices = [];
        document.getElementById('my-money').innerText = data.money.toLocaleString();
        document.getElementById('total-pot').innerText = data.totalPot.toLocaleString();
        renderCards();
        document.getElementById('start-btn').disabled = true;
        document.querySelectorAll('button').forEach(b => b.disabled = false);
    });

    socket.on('updateMoney', (data) => {
        document.getElementById('my-money').innerText = data.money.toLocaleString();
    });

    socket.on('refillMoney', (data) => {
        document.getElementById('my-money').innerText = data.money.toLocaleString();
        alert(`💸 파산 구제! 무료 지원금 ${data.refilledAmount.toLocaleString()}원이 지급되었습니다.`);
    });

    socket.on('updatePot', (data) => {
        document.getElementById('total-pot').innerText = data.totalPot.toLocaleString();
    });

    socket.on('opponentAction', (data) => {
        const betText = data.type === '다이' ? '기권' : `${data.type} (${data.betAmount.toLocaleString()}원)`;
        document.getElementById('status-text').innerText += `\n🔥 ${data.playerNum}번 유저: [${betText}]`;
    });

    function changeMaxPlayers() {
        const val = document.getElementById('max-player-select').value;
        socket.emit('setMaxPlayers', val);
    }

    function requestGame() {
        socket.emit('ready');
        document.getElementById('start-btn').disabled = true;
        document.getElementById('status-text').innerText = "준비 완료! 다른 플레이어를 기다립니다...";
    }

    function renderCards() {
        const el = document.getElementById('player-cards');
        el.innerHTML = '';
        myCards.forEach((card, idx) => {
            const div = document.createElement('div');
            const isSelected = selectedIndices.includes(idx);
            div.className = `card open ${isSelected ? 'selected' : ''}`;
            div.innerText = card.month + (card.kwang ? '光' : '');
            div.onclick = () => selectCard(idx);
            el.appendChild(div);
        });
    }

    function selectCard(idx) {
        if (selectedIndices.includes(idx)) {
            selectedIndices = selectedIndices.filter(i => i !== idx);
        } else if (selectedIndices.length < 2) {
            selectedIndices.push(idx);
        }
        renderCards();
    }

    function sendBet(type) {
        socket.emit('bet', { type: type });
        document.getElementById('status-text').innerText = `👉 내가 [${type}] 베팅을 선택했습니다.`;
    }
</script>
</body>
</html>
