<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3장 섯다 하우스</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --mat-green: #154726;
            --wood-dark: #1b0e07;
            --wood-mid: #2e180c;
            --gold: #dfb15b;
            --gold-bright: #ffd700;
            --card-red: #a81c1c;
        }

        body {
            font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
            background-color: var(--wood-dark);
            background-image: 
                linear-gradient(90deg, rgba(0,0,0,0.3) 1px, transparent 1px),
                repeating-linear-gradient(0deg, var(--wood-dark) 0px, var(--wood-dark) 40px, var(--wood-mid) 41px, var(--wood-mid) 80px);
            background-size: 80px 100%, 100% 80px;
            color: #f0e6d2;
            margin: 0;
            padding: 15px;
            text-align: center;
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
            background: radial-gradient(circle, #1a572f 0%, var(--mat-green) 100%);
            border: 12px solid #3d2112;
            outline: 2px solid var(--gold);
            border-radius: 20px;
            padding: 18px;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 15px 35px rgba(0,0,0,0.9);
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(223, 177, 91, 0.3);
            padding-bottom: 10px;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .money-board {
            display: flex;
            justify-content: space-around;
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(223, 177, 91, 0.4);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 12px;
            font-weight: bold;
            color: var(--gold-bright);
            text-shadow: 1px 1px 2px #000;
        }

        .host-control {
            background: rgba(0, 0, 0, 0.4);
            border: 1px dashed var(--gold);
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 12px;
            display: none;
            font-size: 13px;
        }
        .host-control select {
            padding: 3px 8px;
            font-weight: bold;
            border-radius: 5px;
            background: #2b170c;
            color: var(--gold);
            border: 1px solid var(--gold);
        }

        .card-area {
            display: flex;
            justify-content: center;
            gap: 10px;
            min-height: 85px;
            margin: 10px 0;
            align-items: center;
        }

        .card {
            width: 52px;
            height: 80px;
            background: linear-gradient(135deg, #ffffff 0%, #f0e6d2 100%);
            border: 2px solid #333;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 20px;
            color: #111;
            cursor: pointer;
            box-shadow: 3px 4px 8px rgba(0,0,0,0.6);
            transition: transform 0.15s ease, border 0.15s ease;
            user-select: none;
            position: relative;
        }
        .card.selected-open {
            border: 3px solid #00ffcc;
            box-shadow: 0 0 10px #00ffcc;
            transform: translateY(-5px);
        }
        .card.selected-final {
            border: 3px solid var(--gold-bright);
            transform: translateY(-8px);
            box-shadow: 0 0 12px var(--gold-bright);
        }
        .card.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: #555;
            background: #888;
        }
        .card-back {
            background: linear-gradient(135deg, #801010 0%, #4a0000 100%);
            color: var(--gold);
            border: 2px solid var(--gold);
            font-size: 24px;
            cursor: default;
        }
        .badge {
            position: absolute;
            top: -8px;
            right: -5px;
            background: #000;
            color: var(--gold-bright);
            font-size: 10px;
            padding: 2px 4px;
            border-radius: 4px;
            border: 1px solid var(--gold);
        }

        .status-box {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px;
            border-radius: 10px;
            min-height: 50px;
            margin: 12px 0;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-line;
            color: #fff;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        button {
            padding: 12px 0;
            font-weight: bold;
            font-size: 15px;
            border: 1px solid #55311c;
            border-radius: 8px;
            background: linear-gradient(180deg, #edd293 0%, #c59740 100%);
            color: #2b170c;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
            text-shadow: 0 1px 0 rgba(255,255,255,0.4);
        }
        button:disabled {
            background: #3a3a3a !important;
            color: #777 !important;
            border-color: #222 !important;
            box-shadow: none !important;
            text-shadow: none !important;
            cursor: not-allowed;
        }
        .btn-die {
            background: linear-gradient(180deg, #e75c5c 0%, #b82323 100%);
            color: white;
            text-shadow: 0 1px 2px #000;
            border-color: #6b0f0f;
            grid-column: span 3;
        }

        .opponent-open-area {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(223, 177, 91, 0.2);
            padding: 8px;
            border-radius: 10px;
            margin-bottom: 10px;
            font-size: 13px;
        }

        .btn-jokbo {
            background: #2b170c;
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>🎴 3장 섯다 하우스</div>
        <div>
            <span id="player-role" style="color:var(--gold-bright); font-size: 13px; margin-left:5px;">접속 중...</span>
        </div>
    </div>

    <div class="money-board">
        <div>💵 내 잔액: <span id="my-money">100,000</span>원</div>
        <div>💰 판돈: <span id="total-pot">0</span>원</div>
    </div>

    <div id="host-panel" class="host-control">
        <span>👑 방장 권한: 게임 인원 설정</span>
        <select id="max-player-select" onchange="changeMaxPlayers()">
            <option value="2">2명</option>
            <option value="3">3명</option>
            <option value="4">4명</option>
        </select>
    </div>

    <div class="opponent-open-area">
        <div style="color:var(--gold); font-size:12px;">👁️ 상대방 공개 패</div>
        <div class="card-area" id="opponent-cards">
            <div class="card card-back">🎴</div>
        </div>
    </div>

    <div class="status-box" id="status-text">서버 연결 대기 중...</div>

    <div id="card-instruction" style="font-size:13px; color:var(--gold); margin-top:5px;">👤 내 패</div>
    <div class="card-area" id="player-cards"></div>

    <div class="btn-grid">
        <button id="start-btn" style="grid-column: span 3;" onclick="requestGame()">게임 시작 (준비)</button>
        <button id="half-btn" class="bet-btn" onclick="sendBet('하프')" disabled>하프</button>
        <button id="call-btn" class="bet-btn" onclick="sendBet('콜')" disabled>콜</button>
        <button id="die-btn" class="bet-btn btn-die" onclick="sendBet('다이')" disabled>기권 (DIE)</button>
    </div>
</div>

<script>
    const socket = io();
    let myCards = [];
    let openCardIndex = -1;
    let finalCardIndex = -1;
    let myPlayerNum = 0;
    let selectPhase = 'NONE'; // 'FIRST', 'SECOND', 'NONE'

    socket.on('init', (data) => {
        myPlayerNum = data.playerNum;
        document.getElementById('player-role').innerText = `${data.playerNum}번 플레이어${data.isHost ? ' (방장)' : ''}`;
        document.getElementById('my-money').innerText = data.money.toLocaleString();
        
        if (data.isHost) {
            document.getElementById('host-panel').style.display = 'block';
        }
    });

    socket.on('updateMaxPlayers', (max) => {
        document.getElementById('max-player-select').value = max;
    });

    socket.on('status', (msg) => {
        document.getElementById('status-text').innerText = msg;
    });

    socket.on('gameStart', (data) => {
        myCards = data.cards;
        openCardIndex = -1;
        finalCardIndex = -1;
        selectPhase = 'NONE';

        document.getElementById('my-money').innerText = data.money.toLocaleString();
        document.getElementById('total-pot').innerText = data.totalPot.toLocaleString();
        document.getElementById('opponent-cards').innerHTML = '<div class="card card-back">🎴</div>';
        document.getElementById('card-instruction').innerText = "👤 내 패 (베팅 진행 중)";

        renderCards();

        const startBtn = document.getElementById('start-btn');
        startBtn.innerText = "게임 진행 중";
        startBtn.disabled = true;

        setBetButtons(data.isMyTurn);
    });

    socket.on('requestFirstCardSelect', () => {
        selectPhase = 'FIRST';
        setBetButtons(false);
        document.getElementById('card-instruction').innerText = "👉 까서 공개할 1번째 카드를 클릭하세요!";
    });

    socket.on('receiveThirdCard', (data) => {
        myCards = data.allCards;
        openCardIndex = data.openCardIndex;
        renderCards();
    });

    socket.on('requestSecondCardSelect', () => {
        selectPhase = 'SECOND';
        document.getElementById('card-instruction').innerText = "⚔️ 승부할 2번째 카드를 까주세요! (이미 낸 패 제외)";
    });

    socket.on('turnUpdate', (data) => {
        setBetButtons(data.isMyTurn);
    });

    socket.on('openOneCard', (openCardsInfo) => {
        const opArea = document.getElementById('opponent-cards');
        opArea.innerHTML = '';
        
        const opponentCards = openCardsInfo.filter(info => info.playerNum !== myPlayerNum);

        opponentCards.forEach(info => {
            const div = document.createElement('div');
            div.className = 'card';
            const kwangHtml = info.openCard.kwang ? '<span style="color:#c02727; font-size:14px; vertical-align:super;">光</span>' : '';
            div.innerHTML = info.openCard.month + kwangHtml;
            opArea.appendChild(div);
        });
    });

    socket.on('showdown', (data) => {
        setBetButtons(false);
        selectPhase = 'NONE';

        let resultMsg = `🏆 [${data.winnerNum}번 플레이어] 승리! (${data.winningPot.toLocaleString()}원 획득)\n`;
        data.showdownData.forEach(p => {
            resultMsg += `\n👤 ${p.playerNum}번: [${p.jokboName}]`;
        });
        document.getElementById('status-text').innerText = resultMsg;

        const startBtn = document.getElementById('start-btn');
        startBtn.innerText = "다음 판 게임 시작 (준비)";
        startBtn.disabled = false;
    });

    socket.on('updateMoney', (data) => {
        document.getElementById('my-money').innerText = data.money.toLocaleString();
    });

    socket.on('refillMoney', (data) => {
        document.getElementById('my-money').innerText = data.money.toLocaleString();
        alert(`💸 파산 구제! 지원금 ${data.refilledAmount.toLocaleString()}원이 지급되었습니다.`);
    });

    socket.on('updatePot', (data) => {
        document.getElementById('total-pot').innerText = data.totalPot.toLocaleString();
    });

    socket.on('opponentAction', (data) => {
        const betText = data.type === '다이' ? '기권' : `${data.type}`;
        document.getElementById('status-text').innerText += `\n🔥 ${data.playerNum}번 유저: [${betText}]`;
    });

    function setBetButtons(isMyTurn) {
        const betBtns = document.querySelectorAll('.bet-btn');
        betBtns.forEach(btn => btn.disabled = !isMyTurn);
    }

    function changeMaxPlayers() {
        const val = document.getElementById('max-player-select').value;
        socket.emit('setMaxPlayers', val);
    }

    function requestGame() {
        const startBtn = document.getElementById('start-btn');
        startBtn.disabled = true;
        startBtn.innerText = "준비 완료 (상대 대기 중...)";
        
        socket.emit('ready');
        document.getElementById('status-text').innerText = "준비 완료! 다른 플레이어를 기다립니다...";
    }

    function renderCards() {
        const el = document.getElementById('player-cards');
        el.innerHTML = '';

        myCards.forEach((card, idx) => {
            const div = document.createElement('div');
            let classNames = 'card';

            if (idx === openCardIndex) {
                classNames += selectPhase === 'SECOND' ? ' disabled' : ' selected-open';
            } else if (idx === finalCardIndex) {
                classNames += ' selected-final';
            }

            div.className = classNames;
            const kwangHtml = card.kwang ? '<span style="color:#c02727; font-size:14px; vertical-align:super;">光</span>' : '';
            div.innerHTML = card.month + kwangHtml;

            if (idx === openCardIndex) {
                div.innerHTML += '<span class="badge">1차공개</span>';
            } else if (idx === finalCardIndex) {
                div.innerHTML += '<span class="badge">2차공개</span>';
            }

            div.onclick = () => onCardClick(idx);
            el.appendChild(div);
        });
    }

    function onCardClick(idx) {
        if (selectPhase === 'FIRST') {
            openCardIndex = idx;
            renderCards();
            socket.emit('selectOpenCard', openCardIndex);
            selectPhase = 'NONE';
            document.getElementById('card-instruction').innerText = "👤 1차 카드 공개 완료 (다른 플레이어 대기 중)";
        } else if (selectPhase === 'SECOND') {
            if (idx === openCardIndex) return; // 이미 낸 카드는 클릭 방지
            finalCardIndex = idx;
            renderCards();
            socket.emit('selectFinalCard', finalCardIndex);
            selectPhase = 'NONE';
            document.getElementById('card-instruction').innerText = "👤 2차 카드 공개 완료 (승부 계산 중)";
        }
    }

    function sendBet(type) {
        socket.emit('bet', { type: type });
        setBetButtons(false);
    }
</script>
</body>
</html>
